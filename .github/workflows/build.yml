name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses (best effort)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Restore Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.1/gradle/wrapper/gradle-wrapper.jar

      - name: Fix gradlew executable permission
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > /tmp/gradle-build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::group::Gradle log (tail 100)"
            tail -100 /tmp/gradle-build.log
            echo "::endgroup::"
            echo "::error::Gradle build failed with exit code $status"
            grep -E '^e: ' /tmp/gradle-build.log | head -40 | while IFS= read -r l; do
              echo "::error::$l"
            done || true
            grep -E 'FAILURE:|Caused by:|> Task .* FAILED|What went wrong|Execution failed' /tmp/gradle-build.log | head -20 | while IFS= read -r l; do
              echo "::error::$l"
            done || true
            exit $status
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ewt360-answer-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ewt360-answer-debug-apk
          path: dist/ewt360-answer-debug.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ewt360-answer-debug-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ewt360-answer-debug.apk
          generate_release_notes: true
